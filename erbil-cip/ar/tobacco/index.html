<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-dark: #121A2F;
            --primary-gold: #C38B75;
            --brand-accent: #C38B75;
            --bg-color: #e8e3dd;
            --card-bg: #FFFFFF;
            --text-main: #1C1C1E;
            --text-muted: #8E8E93;
            --border-color: #E5E5EA;
            --transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            --font-arabic: 'Noto Kufi Arabic', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            height: 100%;
            min-height: 100vh;
            min-height: 100dvh;
        }

        body {
            font-family: var(--font-arabic);
            font-size: 16px;
            background-color: #e8e3dd;
            background-image: 
                radial-gradient(ellipse 70% 60% at 12% 15%, rgba(190, 116, 86, 0.45) 0%, transparent 60%),
                radial-gradient(ellipse 65% 55% at 88% 85%, rgba(14, 25, 45, 0.35) 0%, transparent 65%),
                radial-gradient(ellipse 60% 50% at 82% 18%, rgba(228, 167, 144, 0.48) 0%, transparent 60%),
                radial-gradient(ellipse 55% 45% at 18% 82%, rgba(228, 167, 144, 0.38) 0%, transparent 55%),
                radial-gradient(circle at 50% 50%, rgba(232, 227, 221, 0.75) 0%, transparent 70%);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 16px;
            direction: rtl;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background: rgba(255, 255, 255, 0.68);
            backdrop-filter: blur(30px) saturate(210%);
            -webkit-backdrop-filter: blur(30px) saturate(210%);
            width: 100%;
            max-width: 440px;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.88);
            box-shadow: 0 24px 60px rgba(18, 26, 47, 0.09), 0 4px 16px rgba(0, 0, 0, 0.03), inset 0 1.5px 2.5px rgba(255, 255, 255, 1);
            overflow: hidden;
            position: relative;
            min-height: 520px;
            display: flex;
            flex-direction: column;
            margin: auto;
        }

        header {
            text-align: center;
            padding: 28px 20px 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            max-width: 200px;
            width: 72%;
            height: auto;
            display: block;
            margin: 0 auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.04));
        }

        .step-container {
            padding: 20px 20px 24px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .step {
            display: none;
            flex-direction: column;
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            flex-grow: 1;
        }

        .step.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-dark);
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1.02rem;
            font-weight: 600;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.62);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03), inset 0 1px 1.5px rgba(255, 255, 255, 0.95);
            gap: 12px;
        }

        .option-label:active {
            transform: scale(0.985);
            background: rgba(255, 255, 255, 0.85);
        }

        .option-label input { display: none; }

        .cat-icon {
            font-size: 1.3rem;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(195, 139, 117, 0.12);
            flex-shrink: 0;
        }

        .option-text {
            flex-grow: 1;
        }

        .custom-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #C7C7CC;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: var(--transition);
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.9);
            position: relative;
        }

        .custom-checkbox::after {
            content: "";
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2.5px 2.5px 0;
            transform: rotate(45deg) translate(-0.5px, -1px);
            display: none;
        }

        .option-label input:checked ~ .custom-checkbox {
            background-color: var(--brand-accent);
            border-color: var(--brand-accent);
            box-shadow: 0 3px 12px rgba(195, 139, 117, 0.45);
            transform: scale(1.05);
        }

        .option-label input:checked ~ .custom-checkbox::after { display: block; }

        .option-label.selected {
            border: 2px solid var(--brand-accent);
            background: rgba(255, 255, 255, 0.92);
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(195, 139, 117, 0.2);
        }

        .actions-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: auto;
            padding-top: 8px;
            width: 100%;
        }

        .submit-btn {
            flex: 2;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: inherit;
            padding: 16px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.6);
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .submit-btn:disabled {
            background: rgba(255, 255, 255, 0.45);
            color: #8E8E93;
            cursor: not-allowed;
        }

        .submit-btn:not(:disabled) {
            background: linear-gradient(135deg, #C38B75, #D59882);
            color: white;
            box-shadow: 0 8px 25px rgba(195, 139, 117, 0.4);
        }

        .submit-btn:not(:disabled):active {
            transform: scale(0.98);
        }

        .back-btn {
            flex: 1;
            max-width: 130px;
            height: 54px;
            background: rgba(255, 255, 255, 0.58);
            border: 1px solid rgba(255, 255, 255, 0.75);
            padding: 14px;
            border-radius: 20px;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .back-btn:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.8);
        }

        .step-indicator {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.75);
            padding: 5px 14px;
            border-radius: 14px;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 14px;
            align-self: center;
        }

        .success-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding: 24px 0;
        }

        .check-circle {
            width: 84px;
            height: 84px;
            background-color: var(--primary-gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(195, 139, 117, 0.35);
        }

        .check-circle svg { width: 44px; height: 44px; fill: white; }

        @media (max-width: 480px) {
            body { padding: 12px 10px; }
            .container { border-radius: 28px; width: 100%; min-height: 500px; }
            header { padding: 22px 16px 4px; }
            .logo { max-width: 170px; width: 68%; }
            .step-container { padding: 16px 14px 18px; }
            h2 { font-size: 1.15rem; margin-bottom: 16px; }
            .options-grid { gap: 8px; margin-bottom: 12px; }
            .option-label { padding: 12px 14px; font-size: 0.96rem; border-radius: 16px; gap: 10px; }
            .cat-icon { width: 28px; height: 28px; font-size: 1.15rem; }
            .actions-row { gap: 8px; }
            .back-btn { height: 48px; padding: 10px; font-size: 0.92rem; border-radius: 16px; max-width: 110px; }
            .submit-btn { height: 48px; padding: 12px; font-size: 0.98rem; border-radius: 16px; }
        }
    </style>
</head>
<body class="rtl">
    <div class="container">
        <header>
            <img src="/handdown-logo.png" alt="Handdown Duty Free" class="logo" onerror="this.onerror=null; this.src='/Asset 10@2x-8.png';">
        </header>

        <div class="step-container">
            <div id="step-2" class="step active">
                <h2>ماذا اشتريت من هاندداون ديوتي فري؟</h2>
                <div id="rate-limit-banner" style="display:none;background:rgba(211,47,47,0.12);border:1px solid rgba(211,47,47,0.3);color:#D32F2F;padding:14px;border-radius:16px;font-size:0.9rem;text-align:center;margin-bottom:14px;line-height:1.6;font-weight:600;"></div>
                <div class="options-grid" id="options-container"></div>
                <div class="actions-row">
                    <button class="back-btn" onclick="window.location.href='/'"><span>رجوع</span><span>→</span></button>
                    <button class="submit-btn" id="submit-btn" onclick="submitForm()" disabled>إرسال</button>
                </div>
            </div>

            <div id="step-3" class="step">
                <div class="success-content">
                    <div class="check-circle">
                        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    </div>
                    <h2>شكراً جزيلاً على إجابتك!</h2>
                    <p>نتمنى لك رحلة آمنة.</p>
                </div>
            </div>

            <div class="step-indicator" id="step-indicator">الخطوة ۲ من ۲</div>
        </div>
    </div>

    <!-- FIRST: Render categories immediately with icons -->
    <script>
        // ===== Dual Storage 24-Hour Per Device Rate Limiter =====
        const RATE_LIMIT_HOURS = 24;
        const RATE_LIMIT_MS = RATE_LIMIT_HOURS * 60 * 60 * 1000;

        function getRemainingTimeInfo() {
            return { isLocked: false, remainingMs: 0, hoursLeft: 0, minutesLeft: 0 };
        }

        function setSubmissionLockTimestamp() {
            const nowStr = Date.now().toString();
            try { localStorage.setItem('handdown_last_survey_submission_time', nowStr); } catch(e){}
            try { document.cookie = "handdown_last_survey_submission_time=" + nowStr + "; max-age=86400; path=/; SameSite=Lax"; } catch(e){}
        }

        function applyLockedStateUI(hours, mins) {
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');
            const step3 = document.getElementById('step-3');
            const stepIndicator = document.getElementById('step-indicator');
            const optContainer = document.getElementById('options-container');
            const sBtn = document.getElementById('submit-btn');

            if (step1) step1.style.display = 'none';
            if (step2) step2.style.display = 'none';
            if (step3) {
                step3.classList.add('active');
                step3.style.display = 'block';
                step3.innerHTML = `
                    <div style="background: rgba(211,47,47,0.06); border: 2px solid #D32F2F; border-radius: 24px; padding: 28px 20px; text-align: center; margin: 10px 0;">
                        <div style="font-size: 2.8rem; margin-bottom: 10px;">⚠️</div>
                        <h2 style="font-size: 1.35rem; font-weight: 800; color: #121A2F; margin-bottom: 10px;">لقد شاركت بالفعل!</h2>
                        <p style="font-size: 1.02rem; font-weight: 600; color: #4A4A4A; line-height: 1.6; margin-bottom: 16px;">
                            عزيزي المستخدم، يمكنك الإجابة مرة واحدة فقط كل ۲٤ ساعة.
                        </p>
                        <div style="background: #FFFFFF; border: 1.5px solid rgba(211,47,47,0.3); padding: 12px 18px; border-radius: 16px; display: inline-block; font-size: 0.95rem; font-weight: 700; color: #D32F2F; box-shadow: 0 4px 12px rgba(211,47,47,0.08);">
                            ⏰ يمكنك المشاركة مجدداً بعد <b>${hours}</b> ساعة و <b>${mins}</b> دقيقة
                        </div>
                    </div>
                `;
            }
            if (stepIndicator) stepIndicator.style.display = 'none';
            if (optContainer) optContainer.innerHTML = '';
            if (sBtn) { sBtn.disabled = true; sBtn.style.display = 'none'; }
        }

        // Run immediate lock check
        const initialLock = getRemainingTimeInfo();
        if (initialLock.isLocked) {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => applyLockedStateUI(initialLock.hoursLeft, initialLock.minutesLeft));
            } else {
                applyLockedStateUI(initialLock.hoursLeft, initialLock.minutesLeft);
            }
        }

        const categoriesWithIcons = [
            { text: 'التبغ (السجائر)', icon: '🚬', slug: 'tobacco' },
            { text: 'المشروبات الروحية', icon: '🍾', slug: 'alcohol' },
            { text: 'العطور ومستحضرات التجميل', icon: '💄', slug: 'perfumes' },
            { text: 'الساعات والإكسسوارات', icon: '⌚', slug: 'watches' },
            { text: 'الحلويات', icon: '🍬', slug: 'sweets' },
            { text: 'الألعاب', icon: '🧸', slug: 'toys' }
        ];

        const optionsContainer = document.getElementById('options-container');
        const submitBtn = document.getElementById('submit-btn');
        let selectedCatIndex = -1;

        const storeMap = {
            'haji-omaran': 'Haji Omaran Shop (Iran Border)',
            'turkish-border-1': 'Turkish Border Shop 1 (Ibrahim Khalil)',
            'turkish-border-2': 'Turkish Border Shop 2 (Ibrahim Khalil)',
            'erbil-diplomatic': 'Diplomatic Shop (Erbil)',
            'erbil-cip': 'CIP Shop (Erbil Int Airport)',
            'erbil-departure': 'Departure Shop (Erbil Int Airport)',
            'erbil-arrival': 'Arrival Shop (Erbil Int Airport)'
        };

        function getStoreInfo() {
            const urlParams = new URLSearchParams(window.location.search);
            const storeParam = urlParams.get('store') || '';
            const pathname = window.location.pathname.toLowerCase();
            for (const slug in storeMap) {
                if (pathname.includes('/' + slug) || storeParam.includes(slug)) {
                    return { slug: slug, name: storeMap[slug] };
                }
            }
            return { slug: 'general', name: 'Main Portal / General' };
        }

        function getDeviceId() {
            let id = localStorage.getItem('handdown_device_id');
            if (!id) { id = 'dev_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9); localStorage.setItem('handdown_device_id', id); }
            return id;
        }

        // Render options immediately with touch & icons if not locked
        if (!initialLock.isLocked) {
            categoriesWithIcons.forEach((catObj, index) => {
                const label = document.createElement('label');
                label.className = 'option-label';
                
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'category_selection';
                radio.value = catObj.text;
                radio.onchange = () => {
                    if (getRemainingTimeInfo().isLocked) return;
                    optionsContainer.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
                    label.classList.add('selected');
                    submitBtn.disabled = false;
                    selectedCatIndex = index;
                    const storeInfo = getStoreInfo();
                    try {
                        if (storeInfo.slug !== 'general') { window.history.pushState({}, '', `/${storeInfo.slug}/ar/${catObj.slug}`); }
                        else { window.history.pushState({}, '', `/ar/${catObj.slug}`); }
                    } catch(e) {}
                };

                const iconSpan = document.createElement('span');
                iconSpan.className = 'cat-icon';
                iconSpan.innerText = catObj.icon;

                const textSpan = document.createElement('span');
                textSpan.className = 'option-text';
                textSpan.innerText = catObj.text;

                const customCheck = document.createElement('div');
                customCheck.className = 'custom-checkbox';

                label.appendChild(radio);
                label.appendChild(iconSpan);
                label.appendChild(textSpan);
                label.appendChild(customCheck);
                optionsContainer.appendChild(label);
            });

            // Auto-select from URL if not locked
            (function() {
                const pathname = window.location.pathname.toLowerCase();
                const storeParam = (new URLSearchParams(window.location.search).get('store') || '');
                categoriesWithIcons.forEach((catObj, i) => {
                    if (pathname.includes('/' + catObj.slug) || storeParam.includes('/' + catObj.slug)) {
                        const labels = optionsContainer.querySelectorAll('.option-label');
                        if (labels[i]) {
                            const r = labels[i].querySelector('input[type="radio"]');
                            if (r) {
                                r.checked = true;
                                labels[i].classList.add('selected');
                                selectedCatIndex = i;
                                submitBtn.disabled = false;
                            }
                        }
                    }
                });
            })();
        }

        function getStoreThanksMessage() {
            const storeInfo = getStoreInfo();
            const thanksMap = {
                'erbil-arrival': { title: 'شكراً جزيلاً على إجابتك!', sub: 'أهلاً بك في كوردستان.' },
                'erbil-departure': { title: 'شكراً جزيلاً على إجابتك!', sub: 'نتمنى لك رحلة آمنة.' },
                'erbil-cip': { title: 'شكراً جزيلاً على إجابتك!', sub: 'نتمنى لك رحلة آمنة.' },
                'haji-omaran': { title: 'شكراً جزيلاً على إجابتك!', sub: 'نتمنى لك طريقاً آمناً.' },
                'turkish-border-1': { title: 'شكراً جزيلاً على إجابتك!', sub: 'نتمنى لك طريقاً آمناً.' },
                'turkish-border-2': { title: 'شكراً جزيلاً على إجابتك!', sub: 'نتمنى لك طريقاً آمناً.' },
                'erbil-diplomatic': { title: 'شكراً جزيلاً على إجابتك!', sub: 'نتمنى لك وقتاً ممتعاً.' }
            };
            return thanksMap[storeInfo.slug] || { title: 'شكراً جزيلاً على إجابتك!', sub: 'نتمنى لك رحلة آمنة.' };
        }

        // Form Submission
        async function submitForm() {
            const timeInfo = getRemainingTimeInfo();
            if (timeInfo.isLocked) {
                applyLockedStateUI(timeInfo.hoursLeft, timeInfo.minutesLeft);
                return;
            }

            const selected = optionsContainer.querySelector('input[type="radio"]:checked');
            if (!selected) return;

            // Record 24-hour rate limit timestamp in dual storage
            setSubmissionLockTimestamp();

            const storeInfo = getStoreInfo();
            const catSlug = selectedCatIndex >= 0 ? categoriesWithIcons[selectedCatIndex].slug : 'unknown';

            // Save to Appwrite Cloud (if SDK ready)
            if (window._appwriteDB && window.Appwrite) {
                try {
                    await window._appwriteDB.createDocument('handdown_analytics', 'responses', window.Appwrite.ID.unique(), {
                        timestamp: new Date().toISOString(), language: 'Arabic', categories: selected.value,
                        category_slug: catSlug, store: storeInfo.name, store_slug: storeInfo.slug, device_id: getDeviceId()
                    });
                } catch(e) { console.warn('Appwrite save failed:', e); }
            }

            // Always save to localStorage as backup
            const data = localStorage.getItem('handdown_survey_analytics');
            const analytics = data ? JSON.parse(data) : { visits: { ku: 0, ar: 0, en: 0, total: 0 }, responses: [] };
            analytics.responses.push({ id: 'RESP-' + Date.now(), timestamp: new Date().toLocaleString(), language: 'Arabic', categories: selected.value, store: storeInfo.name });
            localStorage.setItem('handdown_survey_analytics', JSON.stringify(analytics));

            // Meta Pixel Lead & SurveySubmit Conversion Tracking
            if (typeof fbq === 'function') {
                fbq('track', 'Lead', {
                    content_category: selected.value,
                    language: 'Arabic',
                    store_location: storeInfo.name
                });
                fbq('trackCustom', 'SurveySubmit', {
                    content_category: selected.value,
                    language: 'Arabic',
                    store_location: storeInfo.name
                });
            }

            const msg = getStoreThanksMessage();
            document.querySelector('#step-3 h2').innerText = msg.title;
            document.querySelector('#step-3 p').innerText = msg.sub;

            document.getElementById('step-2').classList.remove('active');
            document.getElementById('step-3').classList.add('active');
            document.getElementById('step-indicator').style.display = 'none';
        }
    </script>

    <!-- SECOND: Appwrite SDK loaded asynchronously -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@26.2.0/dist/iife/sdk.min.js"></script>
    <script>
        try {
            if (window.Appwrite) {
                const client = new Appwrite.Client();
                client.setEndpoint('https://fra.cloud.appwrite.io/v1').setProject('6a65bea6001b95f75b63');
                window._appwriteDB = new Appwrite.Databases(client);

                (async function() {
                    const sessionKey = 'handdown_visit_session_ar';
                    if (sessionStorage.getItem(sessionKey)) return;
                    sessionStorage.setItem(sessionKey, 'true');
                    const storeInfo = getStoreInfo();
                    try {
                        await window._appwriteDB.createDocument('handdown_analytics', 'visits', Appwrite.ID.unique(), {
                            timestamp: new Date().toISOString(), language: 'Arabic', store: storeInfo.name,
                            store_slug: storeInfo.slug, device_id: getDeviceId(), page_url: window.location.href
                        });
                    } catch(e) {}

                    const data = localStorage.getItem('handdown_survey_analytics');
                    const analytics = data ? JSON.parse(data) : { visits: { ku: 0, ar: 0, en: 0, total: 0 }, responses: [] };
                    analytics.visits.ar = (analytics.visits.ar || 0) + 1;
                    analytics.visits.total = (analytics.visits.ku || 0) + (analytics.visits.ar || 0) + (analytics.visits.en || 0);
                    localStorage.setItem('handdown_survey_analytics', JSON.stringify(analytics));
                })();
            }
        } catch(e) {}
    </script>
</body>
</html>
